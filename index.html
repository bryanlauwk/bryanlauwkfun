        <p style="font:600 10px 'JetBrains Mono',monospace;text-transform:uppercase;color:#6e6b64;margin:0 0 1.25rem;">A playground for games, experiments &amp; builds</p>
        <h1 style="font:900 clamp(3.2rem,8vw,5.8rem)/.92 Archivo,Arial,sans-serif;color:#171612;margin:0;text-transform:uppercase;">Good luck.<br>Have fun.<br><span style="color:#d92318;">Don’t die.</span></h1>
        <p style="max-width:34rem;font-size:15px;line-height:1.65;color:#67645e;margin:1.5rem 0 0;">I build games, interactive experiments, and physical curiosities. Pick one and see what happens.</p>
        <noscript><p style="margin-top:2rem;color:#171612;font-family:'JetBrains Mono',monospace;font-size:11px;">Enable JavaScript to explore the games and experiments.</p></noscript>
      </main>
    </div>
    <script>
      // Safety net: if the React app never mounts within 8s, surface a reload prompt
      // instead of leaving users stranded on the static shell.
      window.__mountWatch = setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          var shell = document.getElementById('static-fallback');
          if (shell) {
            var note = document.createElement('p');
            note.style.cssText = 'margin-top:1.5rem;color:#171612;font-family:JetBrains Mono,monospace;font-size:11px;';
            note.innerHTML = 'Trouble loading. <a href="/" style="color:#d92318;text-decoration:underline;" onclick="location.reload();return false;">Tap to reload</a>.';
            var main = shell.querySelector('main');
            if (main) main.appendChild(note);
          }
        }
      }, 8000);
      window.addEventListener('error', function (e) {
        // Log module-load errors so they show up in monitoring instead of silently blanking.
        console.error('[boot]', (e && e.error) || e);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
