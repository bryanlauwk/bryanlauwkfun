  <body>
    <div id="root"></div>
    <div id="static-fallback" style="position:fixed;inset:0;z-index:0;min-height:100vh;background:#050f12;color:#9db1b4;font-family:Inter,sans-serif;display:flex;flex-direction:column;">
      <header style="padding:1rem 1.25rem;display:flex;align-items:center;gap:0.75rem;">
        <span style="width:14px;height:14px;border-radius:999px;background:radial-gradient(circle at 35% 30%,#6fe3cd,#1b6a5f);box-shadow:0 0 14px rgba(111,227,205,0.55);"></span>
        <div style="line-height:1.15;">
          <div style="font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.1rem;color:#eee7dc;">Bryan Lau</div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:9px;text-transform:uppercase;letter-spacing:0.3em;color:#6f8487;margin-top:2px;">A living playground</div>
        </div>
      </header>
      <main style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem 1.25rem;text-align:center;">
        <p style="font-family:'JetBrains Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:0.3em;color:#6f8487;margin:0 0 1.5rem;">You found the door</p>
        <h1 style="font-family:Fraunces,Georgia,serif;font-size:clamp(2.2rem,8vw,4.5rem);font-weight:400;color:#eee7dc;margin:0;line-height:1.05;letter-spacing:-0.015em;max-width:20ch;">
          A place that is <em style="color:#6fe3cd;">still growing</em>, and knows you are here.
        </h1>
        <p style="font-size:1rem;color:#9db1b4;margin:1.75rem 0 0;max-width:34ch;line-height:1.6;">Small playable art, browser-born experiments, and a new season always growing.</p>
        <noscript><p style="margin-top:2rem;color:#eee7dc;font-family:'JetBrains Mono',monospace;font-size:11px;">Enable JavaScript to explore the interactive works.</p></noscript>
      </main>
    </div>
    <script>
      // Safety net: if the React app never mounts within 8s, surface a reload prompt
      // instead of leaving users stranded on the static shell.
      window.__mountWatch = setTimeout(function () {
        var root = document.getElementById('root');
        if (root && root.childElementCount === 0) {
          var shell = document.getElementById('static-fallback');
          if (shell) {
            var note = document.createElement('p');
            note.style.cssText = 'margin-top:1.5rem;color:#e8e8ec;font-family:JetBrains Mono,monospace;font-size:11px;';
            note.innerHTML = 'Trouble loading. <a href="/" style="color:hsl(4,90%,60%);text-decoration:underline;" onclick="location.reload();return false;">Tap to reload</a>.';
            var main = shell.querySelector('main');
            if (main) main.appendChild(note);
          }
        }
      }, 8000);
      window.addEventListener('error', function (e) {
        // Log module-load errors so they show up in monitoring instead of silently blanking.
        console.error('[boot]', (e && e.error) || e);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
